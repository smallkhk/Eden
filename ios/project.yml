name: LiveChar
options:
  bundleIdPrefix: app.livechar
  deploymentTarget:
    iOS: "16.0"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    exactVersion: 150.7871.04
settings:
  base:
    # server the app opens; CI overrides it with LIVECHAR_URL=... (changeable in the app: Account → Server)
    LIVECHAR_URL: https://162-35-37-67.sslip.io
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  LiveChar:
    type: application
    platform: iOS
    sources: [LiveChar]
    dependencies:
      - package: LiveKit
      - package: LiveKitWebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.livechar.ios
        PRODUCT_NAME: LiveChar
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LiveChar/Info.plist
      properties:
        CFBundleDisplayName: LiveChar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LiveCharURL: $(LIVECHAR_URL)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen:
          UIColorName: LaunchBg
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: LiveChar uses the camera to turn you into your character live.
        NSMicrophoneUsageDescription: LiveChar does not record sound; this is only asked if a video library requests it.
        NSPhotoLibraryAddUsageDescription: LiveChar saves your photos and recordings to Photos.
        NSPhotoLibraryUsageDescription: LiveChar lets you pick a character image from your photos.
        UIFileSharingEnabled: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
