name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["desktop/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "LiveChar server URL to bake in (https://...). Empty = ask on first run."
        required: false
        default: ""
      release_version:
        description: "Publish as a release with this version (e.g. 1.1.0). Installed apps update to it. Empty = build only."
        required: false
        default: ""

permissions:
  contents: write

env:
  SOFTCAM_REF: v1.8.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---- virtual camera (Softcam DirectShow filter, MIT) ----
      - name: Checkout Softcam
        uses: actions/checkout@v4
        with:
          repository: tshino/softcam
          ref: ${{ env.SOFTCAM_REF }}
          path: softcam-src

      - uses: microsoft/setup-msbuild@v2

      - name: Build softcam.dll (x64 + Win32)
        working-directory: softcam-src
        shell: pwsh
        run: |
          nuget restore softcam.sln
          msbuild softcam.sln /m /t:softcam /p:Configuration=Release /p:Platform=x64
          msbuild softcam.sln /m /t:softcam /p:Configuration=Release /p:Platform=Win32
          New-Item -ItemType Directory -Force ../desktop/softcam/x64, ../desktop/softcam/Win32 | Out-Null
          Copy-Item dist/bin/x64/softcam.dll   ../desktop/softcam/x64/softcam.dll
          Copy-Item dist/bin/Win32/softcam.dll ../desktop/softcam/Win32/softcam.dll
          Copy-Item LICENSE ../desktop/softcam/LICENSE-softcam.txt
          Get-ChildItem -Recurse ../desktop/softcam

      # ---- Windows 11 camera (Media Foundation), source in desktop/wincam ----
      - name: Build LiveChar Camera (Windows 11)
        working-directory: desktop/wincam
        shell: pwsh
        run: |
          nuget restore VCamSample.sln
          # the projects name the VS 2026 toolset; use the VS 2022 one when that is what the runner has
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $line = & $vswhere -latest -property catalog_productLineVersion
          $toolset = @(); if ($line -eq "2022") { $toolset = @("/p:PlatformToolset=v143") }
          Write-Host "Visual Studio $line $toolset"
          msbuild VCamSample.sln /m /p:Configuration=Release /p:Platform=x64 @toolset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ../wincam-bin | Out-Null
          Copy-Item x64/Release/VCamSample.exe       ../wincam-bin/LiveCharCam.exe
          Copy-Item x64/Release/VCamSampleSource.dll ../wincam-bin/LiveCharCamSource.dll
          Copy-Item LICENSE ../wincam-bin/LICENSE-VCamSample.txt
          Get-ChildItem ../wincam-bin

      # Information only: build servers are not Windows 11 desktops, so this may fail without meaning anything.
      # It also runs the unmodified upstream camera the same way, to tell our changes apart from the machine.
      - name: Checkout upstream camera sample (for comparison)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: smourier/VCamSample
          ref: 58b6d4b0e0c2c97fdffd66d23e7c8da6b89f570d
          path: vcam-upstream

      - name: Try the camera on the build machine
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Get-Service FrameServer, FrameServerMonitor -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType
          # allow camera use, in case privacy settings are what blocks it
          foreach ($root in "HKLM", "HKCU") {
            foreach ($k in "webcam", "webcam\NonPackaged") {
              $path = "${root}:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\$k"
              New-Item -Path $path -Force | Out-Null; Set-ItemProperty -Path $path -Name Value -Value Allow
            }
          }
          $dir = "C:\LiveCharCamTest"; New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item desktop/wincam-bin/* $dir
          function Try-Camera($label, $dll, $clsid) {
            $r = Start-Process regsvr32 -ArgumentList "/s", $dll -Wait -PassThru
            $out = "$dir\out-$label.txt"
            $p = Start-Process -FilePath "$dir\LiveCharCam.exe" -ArgumentList "0 $clsid" -RedirectStandardOutput $out -PassThru -NoNewWindow
            Start-Sleep -Seconds 8
            $running = -not $p.HasExited
            if ($running) { $p.Kill() }
            Write-Host "[$label] regsvr32=$($r.ExitCode) helper-running=$running output=$(Get-Content $out -Raw -ErrorAction SilentlyContinue)"
          }
          Try-Camera "livechar" "$dir\LiveCharCamSource.dll" ""
          if (Test-Path vcam-upstream/VCamSample.sln) {
            Push-Location vcam-upstream
            nuget restore VCamSample.sln | Out-Null
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $toolset = @(); if ((& $vswhere -latest -property catalog_productLineVersion) -eq "2022") { $toolset = @("/p:PlatformToolset=v143") }
            msbuild VCamSample.sln /m /v:q /nologo /t:VCamSampleSource /p:Configuration=Release /p:Platform=x64 @toolset | Select-Object -Last 3
            Pop-Location
            Copy-Item vcam-upstream/x64/Release/VCamSampleSource.dll "$dir\UpstreamSource.dll"
            Try-Camera "upstream" "$dir\UpstreamSource.dll" "{3cad447d-f283-4af4-a3b2-6f5363309f52}"
          }

      # ---- desktop app ----
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bake server URL
        shell: pwsh
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || vars.LIVECHAR_URL }}
        run: |
          # No URL given: keep the one committed in desktop/config.json
          if ($env:SERVER_URL) { Set-Content -Path desktop/config.json -Value (@{ url = "$env:SERVER_URL" } | ConvertTo-Json) -Encoding utf8 }
          Get-Content desktop/config.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.release_version }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      # A v* tag, or "Run workflow" with a release version, publishes a GitHub release.
      # Installed apps update themselves from the latest release.
      - name: Build and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_version }}
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.release_version || github.ref_name }}".TrimStart("v")
          npm version $version --no-git-tag-version --allow-same-version
          npm run release

      - uses: actions/upload-artifact@v4
        with:
          name: LiveChar-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
