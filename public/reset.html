<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='10' fill='%234fd8eb'/%3E%3Ccircle cx='20' cy='16' r='10' fill='%23ff5c8a' fill-opacity='.9'/%3E%3C/svg%3E">
<title>LiveChar — Reset password</title>
<link rel="stylesheet" href="/ui.css">
<style>
  body { display:grid; place-items:center; padding:20px; }
  .card { width:min(400px, 100%); }
  .card .brand { margin-bottom:22px; }
  .card h1 { font-size:26px; margin-bottom:8px; }
  .card p { color:var(--dim); margin:0 0 6px; }
  .card button.primary { width:100%; margin-top:16px; font-size:16px; padding:13px; }
  .card .backlink { display:block; text-align:center; margin-top:14px; font-size:14px; text-decoration:none; }
</style>
</head>
<body>
<div class="panel card">
  <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="10" fill="#4fd8eb"/><circle cx="20" cy="16" r="10" fill="#ff5c8a" fill-opacity=".9"/></svg>LiveChar</a>
  <div id="ask">
    <h1>Forgot your password?</h1>
    <p>Enter your username or email. If the account has an email address, we'll send a reset link to it.</p>
    <label for="login">Username or email</label><input id="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <button id="send" class="primary">Send reset link</button>
  </div>
  <div id="set" hidden>
    <h1>Choose a new password</h1>
    <label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password">
    <button id="save" class="primary">Save password</button>
  </div>
  <div class="msg" id="msg"></div>
  <a class="backlink" href="/">Back to log in</a>
</div>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("token") || "";
const say = (t, err) => { $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); };
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong");
}
if (token) { $("ask").hidden = true; $("set").hidden = false; history.replaceState(null, "", "/reset"); }
$("send").onclick = async () => {
  if (!$("login").value.trim()) return say("Enter your username or email", true);
  try { await post("/api/password/forgot", { login: $("login").value.trim() }); say("If that account has an email address, a reset link is on its way. Check your inbox and spam folder."); }
  catch (e) { say(e.message, true); }
};
$("save").onclick = async () => {
  try { await post("/api/password/reset", { token, password: $("pw").value }); $("set").hidden = true; say("Password changed. You can log in now."); }
  catch (e) { say(e.message, true); }
};
$("login").onkeydown = (e) => e.key === "Enter" && $("send").click();
$("pw").onkeydown = (e) => e.key === "Enter" && $("save").click();
</script>
</body>
</html>
