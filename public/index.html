<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>LiveChar — live AI character changer</title>
<style>
  :root { --bg:#0b0d12; --panel:#141821; --line:#232a38; --text:#e8ecf3; --dim:#8b95a8; --acc:#7c5cff; --ok:#2ecc8f; --bad:#ff5d6c; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; letter-spacing:.2px; }
  .pill { font-size:12px; padding:3px 10px; border-radius:999px; background:var(--line); color:var(--dim); }
  .pill.ok { background:rgba(46,204,143,.15); color:var(--ok); }
  #stats { margin-left:auto; font:12px ui-monospace,Menlo,Consolas,monospace; color:var(--dim); text-align:right; }
  main { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px; max-width:1500px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
  label { display:block; font-size:12px; color:var(--dim); margin:12px 0 6px; text-transform:uppercase; letter-spacing:.6px; }
  label:first-child { margin-top:0; }
  select, textarea, input[type=password] { width:100%; background:#0e1118; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
  textarea { min-height:92px; resize:vertical; }
  .row { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; color:var(--text); }
  .row input { accent-color:var(--acc); }
  .ref { display:flex; align-items:center; gap:10px; }
  .ref img { width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line); }
  .filebtn, button { cursor:pointer; border:1px solid var(--line); background:#1b2130; color:var(--text); border-radius:10px; padding:10px 14px; font:inherit; }
  .filebtn input { display:none; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .btns .wide { grid-column:1/-1; }
  #outView { touch-action:none; user-select:none; }
  #note { min-height:20px; margin-top:10px; font-size:13px; color:var(--dim); }
  .stage { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-content:start; }
  .view { position:relative; background:#000; border:1px solid var(--line); border-radius:14px; overflow:hidden; aspect-ratio:16/9; }
  .view video { width:100%; height:100%; object-fit:contain; display:block; }
  body.mirror .view video { transform:scaleX(-1); }
  body.portrait .stage { justify-items:center; }
  body.portrait .view { aspect-ratio:9/16; height:min(78vh,720px); max-width:100%; }
  .tag { position:absolute; top:10px; left:10px; z-index:1; font-size:11px; letter-spacing:.8px; padding:3px 8px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; }
  .hint { font-size:12px; color:var(--dim); margin-top:6px; }
  #gate { position:fixed; inset:0; background:rgba(5,7,10,.92); display:grid; place-items:center; z-index:10; }
  #gate[hidden] { display:none; }
  #gate .panel { width:min(340px,90vw); }
  #pwErr { color:var(--bad); font-size:13px; min-height:18px; margin-top:8px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } .stage { grid-template-columns:1fr; } #stats { display:none; } }
</style>
</head>
<body>
<div id="gate" hidden>
  <div class="panel">
    <label for="pw">Access password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div id="pwErr"></div>
    <button id="pwBtn" class="primary" style="width:100%">Enter</button>
  </div>
</div>

<header>
  <h1>LiveChar</h1>
  <span id="status" class="pill">idle</span>
  <div id="stats"></div>
</header>

<main>
  <section class="panel">
    <label for="engine">Engine</label>
    <select id="engine">
      <option value="lucy">Decart Lucy — 720p, fastest</option>
      <option value="eden-5b">Eden Live 5B — 720p @ 24fps</option>
      <option value="eden-14b">Eden Live 14B — 480p @ 16fps</option>
    </select>
    <div class="row" id="fastRow"><input id="fast" type="checkbox" checked><span>Fast mode (lower latency, 2× cost)</span></div>

    <label for="rot">Camera orientation</label>
    <div class="row" style="margin-top:0;gap:8px">
      <select id="rot" title="Rotate the camera before it goes to the AI">
        <option value="0">Rotate 0°</option><option value="90">Rotate 90°</option>
        <option value="180">Rotate 180°</option><option value="270">Rotate 270°</option>
      </select>
      <select id="orient" title="Frame shape">
        <option value="landscape">Landscape</option><option value="portrait">Portrait</option>
      </select>
    </div>
    <div class="hint">Rotation works live. Portrait is Lucy only.</div>

    <label>Character image</label>
    <div class="ref">
      <label class="filebtn" style="margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)">
        Upload<input id="file" type="file" accept="image/jpeg,image/png,image/webp">
      </label>
      <img id="thumb" alt="Character reference" hidden>
      <button id="clearImg" hidden>Remove</button>
    </div>
    <div class="hint">Clear, front-facing, 512px or larger.</div>

    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Describe the character, or leave empty to just use the image. e.g. “an elderly wizard with a long silver beard and blue robes”"></textarea>
    <div class="row"><input id="expand" type="checkbox" checked><span>Enhance prompt</span></div>
    <div class="row"><input id="mirror" type="checkbox" checked><span>Mirror view</span></div>
    <label for="zoom">Output zoom <span id="zoomVal" style="text-transform:none">1.00×</span></label>
    <div class="row" style="margin-top:0"><input id="zoom" type="range" min="1" max="4" step="0.05" value="1" style="flex:1"><button id="zoomReset">Reset</button></div>
    <div class="hint">Scroll over the output to zoom, drag to move, double-click to reset.</div>
    <div class="row" id="vcamRow" hidden><input id="vcam" type="checkbox"><span>Virtual camera output</span></div>
    <div class="hint" id="vcamHint" hidden></div>

    <div class="btns">
      <button id="start" class="primary">Start</button>
      <button id="stop" disabled>Stop</button>
      <button id="apply" class="wide" disabled>Apply changes live</button>
    </div>
    <div id="note"></div>
  </section>

  <section class="stage">
    <div class="view"><span class="tag">CAMERA</span><video id="inV" autoplay playsinline muted></video></div>
    <div class="view" id="outView"><span class="tag">OUTPUT</span><video id="outV" autoplay playsinline muted></video></div>
  </section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
