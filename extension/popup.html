<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#0e1020; --stage:#171a33; --well:#101328; --line:#2c3160; --text:#eef0ff; --dim:#9aa0c7; --you:#4fd8eb; --char:#ff5c8a; --ok:#5be3a1; }
  * { box-sizing:border-box; }
  body { margin:0; width:340px; background:var(--ink); color:var(--text); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:9px; padding:14px 16px 10px; font-weight:800; font-size:16px; }
  header img { width:22px; height:22px; border-radius:6px; }
  main { padding:0 16px 16px; display:grid; gap:12px; }
  canvas { width:100%; aspect-ratio:16/9; background:#000; border-radius:14px; border:1px solid var(--line); display:block; }
  .state { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--dim); }
  .state i { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .state.live { color:var(--text); } .state.live i { background:var(--char); box-shadow:0 0 0 4px rgba(255,92,138,.25); }
  label.f { display:grid; gap:5px; font-size:12px; font-weight:600; color:var(--dim); }
  input[type=url] { width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--well); color:var(--text); font:13px ui-monospace, Menlo, Consolas, monospace; }
  input[type=url]:focus { outline:2px solid var(--you); outline-offset:1px; }
  .row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--stage); border:1px solid var(--line); cursor:pointer; }
  .row b { display:block; font-size:13px; } .row small { color:var(--dim); font-size:12px; }
  .row input { width:18px; height:18px; accent-color:var(--char); flex:none; }
  .hint { color:var(--dim); font-size:12px; }
  .err { color:#ff6b6b; font-size:12px; }
</style>
</head>
<body>
<header><img src="icon-48.png" alt="">LiveChar Camera</header>
<main>
  <canvas id="v"></canvas>
  <span class="state" id="state"><i></i><span id="stateText">No link yet</span></span>
  <label class="f">Your live link (Account → Live link in the iPhone app)
    <input type="url" id="link" placeholder="https://your-server/watch/…" spellcheck="false">
  </label>
  <div class="err" id="err" hidden></div>
  <label class="row"><input type="checkbox" id="enabled"><span><b>Use as my camera in this browser</b><small>Sites see a camera called “LiveChar (iPhone)”.</small></span></label>
  <label class="row"><input type="checkbox" id="replaceAll"><span><b>For every camera request</b><small>On: every site gets it without choosing. Off: pick “LiveChar (iPhone)” in the site's camera list.</small></span></label>
  <label class="row"><input type="checkbox" id="voice"><span><b>Use LiveChar voice as my microphone</b><small>Sites hear your new voice (turn on “Change my voice” in the app). Video waits ~2 s so the lips match.</small></span></label>
  <div class="hint">Reload a site that is already open after changing these. Turn on “Share live to my link” in the iPhone app.</div>
</main>
<script src="player.js"></script>
<script src="popup.js"></script>
</body>
</html>
