name: CamTest
options:
  bundleIdPrefix: app.livechar
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  CamTest:
    type: application
    platform: iOS
    sources: [CamTest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.livechar.camtest
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CamTest/Info.plist
      properties:
        CFBundleDisplayName: Cam Test
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [voip, audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Cam Test shows and records your camera.
        NSMicrophoneUsageDescription: Cam Test records sound with your videos.
        NSPhotoLibraryAddUsageDescription: Cam Test saves photos and videos to Photos.
