<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LiveChar — setup</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#0b0d12;color:#e8ecf3;font:15px system-ui,Segoe UI,sans-serif}
  .p{width:420px;background:#141821;border:1px solid #232a38;border-radius:14px;padding:22px}
  h1{font-size:18px;margin:0 0 6px} p{color:#8b95a8;margin:0 0 14px;font-size:13px}
  input{width:100%;box-sizing:border-box;background:#0e1118;color:#e8ecf3;border:1px solid #232a38;border-radius:10px;padding:10px;font:inherit}
  button{margin-top:12px;width:100%;background:#7c5cff;border:0;color:#fff;font:600 15px system-ui;border-radius:10px;padding:11px;cursor:pointer}
  #e{color:#ff5d6c;font-size:13px;min-height:18px;margin-top:8px}
</style></head><body>
<div class="p">
  <h1>Connect to your LiveChar server</h1>
  <p>Enter the HTTPS address where your LiveChar server is running.</p>
  <input id="u" placeholder="https://livechar.example.com" autofocus>
  <div id="e"></div>
  <button id="b">Connect</button>
</div>
<script>
  const u = document.getElementById("u"), e = document.getElementById("e");
  async function go() {
    e.textContent = "";
    const r = await window.livecharSetup.save(u.value.trim());
    if (r && r.error) e.textContent = r.error;
  }
  document.getElementById("b").onclick = go;
  u.onkeydown = (ev) => ev.key === "Enter" && go();
  window.livecharSetup.current().then((v) => { if (v) u.value = v; });
</script>
</body></html>
